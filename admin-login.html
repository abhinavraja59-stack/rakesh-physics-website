<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rakesh Physics | Admin Login</title><link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-config.js"></script><script defer src="admin-login.js"></script></head>
<body class="login-page"><main class="login-card"><div class="brand-mark">RP</div><p class="eyebrow">RAKESH PHYSICS</p><h1>Admin Panel</h1><p class="muted">Secure access for authorized administration.</p>
<form id="login-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com">
