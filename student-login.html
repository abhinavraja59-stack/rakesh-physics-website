<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | Rakesh Physics</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(circle at 15% 15%,#2563eb55,transparent 30%),
radial-gradient(circle at 85% 85%,#9333ea55,transparent 30%),
linear-gradient(135deg,#07111f,#0b1730,#111827);
color:white;
}

.login-card{
width:100%;
max-width:390px;
padding:30px 26px 24px;
border:1px solid rgba(255,255,255,.16);
border-radius:28px;
background:rgba(255,255,255,.09);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.brand{
text-align:center;
margin-bottom:24px;
}

.logo{
width:64px;
height:64px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
border-radius:20px;
font-size:30px;
background:linear-gradient(135deg,#2563eb,#7c3aed);
box-shadow:0 10px 30px #2563eb55;
}

.brand h1{
margin-top:14px;
font-size:23px;
letter-spacing:.3px;
}

.brand p{
margin-top:5px;
font-size:13px;
color:#b8c3d9;
}

.welcome{
text-align:center;
margin-bottom:20px;
}

.welcome h2{
font-size:18px;
}

.welcome span{
display:block;
margin-top:5px;
color:#aebbd0;
font-size:12px;
}

.input-box{
margin-top:15px;
}

.input-box label{
display:block;
margin-bottom:7px;
font-size:12px;
color:#cbd5e1;
}

.input-box input{
width:100%;
padding:14px 15px;
border:1px solid rgba(255,255,255,.14);
border-radius:14px;
outline:none;
background:rgba(0,0,0,.22);
color:white;
font-size:14px;
}

.input-box input:focus{
border-color:#60a5fa;
box-shadow:0 0 0 3px #2563eb22;
}

.login-btn{
width:100%;
margin-top:21px;
padding:14px;
border:0;
border-radius:14px;
cursor:pointer;
color:white;
font-size:15px;
font-weight:700;
background:linear-gradient(135deg,#2563eb,#7c3aed);
box-shadow:0 12px 28px #2563eb44;
}

.login-btn:active{
transform:scale(.98);
}

.quick-links{
display:flex;
justify-content:space-between;
margin-top:16px;
font-size:11px;
}

.quick-links a{
color:#93c5fd;
text-decoration:none;
}

.divider{
height:1px;
background:rgba(255,255,255,.1);
margin:22px 0 16px;
}

.bottom{
text-align:center;
color:#94a3b8;
font-size:11px;
line-height:1.6;
}

.bottom strong{
color:#e2e8f0;
}

.badge{
display:inline-block;
margin-top:12px;
padding:6px 12px;
border-radius:20px;
background:rgba(34,197,94,.12);
color:#86efac;
font-size:10px;
border:1px solid rgba(34,197,94,.2);
}

@media(max-width:420px){
.login-card{
padding:26px 21px 22px;
border-radius:24px;
}
}
</style>
</head>

<body>

<div class="login-card">

<div class="brand">
<div class="logo">🎓</div>

<h1>Rakesh Physics</h1>

<p>Student Learning Portal</p>
</div>

<div class="welcome">
<h2>Good Morning, Student 👋</h2>
<span>Your learning journey starts here.</span>
</div>

<div class="input-box">
<label>Student ID / Mobile Number</label>
<input
type="text"
id="studentId"
placeholder="Enter your Student ID"
>
</div>

<div class="input-box">
<label>Password / PIN</label>
<input
type="password"
id="password"
placeholder="Enter your password"
>
</div>

<button class="login-btn" onclick="loginStudent()">
🚀 Enter Student Dashboard
</button>

<div class="quick-links">
<a href="#">Forgot Password?</a>
<a href="index.html">← Back to Website</a>
</div>

<div class="divider"></div>

<div class="bottom">
<strong>Learn • Practice • Achieve</strong><br>
Your success is our mission.
<div class="badge">● Student Portal</div>
</div>

</div>

<script>
function loginStudent() {

const studentId = document.getElementById("studentId").value.trim();
const password = document.getElementById("password").value.trim();

if (studentId === "" || password === "") {
alert("Please enter your Student ID and Password.");
return;
}

localStorage.setItem("studentID", studentId);

window.location.href = "student-dashboard.html";
}
</script>

</body>
</html>
