<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rakesh Physics | Reset Admin Password</title>
  <link rel="stylesheet" href="admin.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-config.js"></script>
</head>

<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">RP</div>
    <p class="eyebrow">RAKESH PHYSICS</p>
    <h1>Reset Password</h1>
    <p class="muted">
      Create a new password for your authorized admin account.
    </p>

    <form id="reset-form">
      <label for="new-password">New password</label>
      <input
        id="new-password"
        type="password"
        autocomplete="new-password"
        minlength="10"
        placeholder="At least 10 characters"
        required
      >

      <label for="confirm-password">Confirm new password</label>
      <input
        id="confirm-password"
        type="password"
        autocomplete="new-password"
        minlength="10"
        placeholder="Enter password again"
        required
      >

      <button id="reset-button" type="submit">
        Update password
      </button>

      <p id="reset-message" class="message" role="status"></p>
    </form>

    <p class="footnote">
      Use this page only after opening a valid password recovery link.
    </p>
  </main>

  <script>
    (async function () {
      const config = window.RP_ADMIN_CONFIG || {};
      const message = document.getElementById("reset-message");
      const form = document.getElementById("reset-form");
      const button = document.getElementById("reset-button");

      if (
        !window.supabase ||
        !config.SUPABASE_URL ||
        !config.SUPABASE_PUBLISHABLE_KEY
      ) {
        message.textContent =
          "Configuration missing. Please contact the administrator.";
        form.hidden = true;
        return;
      }

      const client = window.supabase.createClient(
        config.SUPABASE_URL,
        config.SUPABASE_PUBLISHABLE_KEY
      );

      // Supabase may return the recovery session in the URL fragment.
      // The SDK processes the callback and stores the session.
      const { data, error } = await client.auth.getSession();

      if (error || !data.session) {
        message.textContent =
          "This recovery link is invalid or expired. Request a new password recovery email.";
        form.hidden = true;
        return;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const password =
          document.getElementById("new-password").value;
        const confirmation =
          document.getElementById("confirm-password").value;

        if (password.length < 10) {
          message.textContent =
            "Please use at least 10 characters for your password.";
          return;
        }

        if (password !== confirmation) {
          message.textContent =
            "The passwords do not match. Please try again.";
          return;
        }

        button.disabled = true;
        message.textContent = "Updating password…";

        const { error: updateError } =
          await client.auth.updateUser({ password });

        if (updateError) {
          message.textContent =
            "Password update failed: " + updateError.message;
          button.disabled = false;
          return;
        }

        // End the recovery session after a successful update.
        await client.auth.signOut();

        message.textContent =
          "Password updated successfully. You can now sign in.";

        form.reset();

        const loginLink = document.createElement("a");
        loginLink.href = "admin-login.html";
        loginLink.textContent = "Go to Admin Login";
        loginLink.style.display = "inline-block";
        loginLink.style.marginTop = "16px";
        form.appendChild(loginLink);
      });
    })();
  </script>
</body>
</html>
